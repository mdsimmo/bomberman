plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '2.3.0'
    id 'com.gradleup.shadow' version '9.3.0'
}

group = 'io.github.mdsimmo'
version = '0.9.0-MCRW'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://' + 'repo.papermc.io' + '/repository/maven-public/'
    }
    maven {
        name = 'enginehub'
        url = 'https://' + 'maven.enginehub.org' + '/repo/'
    }
    maven {
        name = 'jitpack'
        url = 'https://' + 'jitpack.io'
    }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib'
    implementation 'net.objecthunter:exp4j:0.4.8'

    compileOnly 'io.papermc.paper:paper-api:26.3.build.+'
    testImplementation 'io.papermc.paper:paper-api:26.3.build.+'

    compileOnly('com.sk89q.worldedit:worldedit-bukkit:7.3.10') {
        transitive = false
    }
    compileOnly('com.sk89q.worldedit:worldedit-core:7.3.10') {
        transitive = false
    }
    testImplementation('com.sk89q.worldedit:worldedit-bukkit:7.3.10') {
        transitive = false
    }
    testImplementation('com.sk89q.worldedit:worldedit-core:7.3.10') {
        transitive = false
    }

    compileOnly('com.github.PlaceholderAPI:PlaceholderAPI:2.11.6') {
        transitive = false
    }
    testImplementation('com.github.PlaceholderAPI:PlaceholderAPI:2.11.6') {
        transitive = false
    }

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.15.2'

    compileOnly 'org.enginehub.lin-bus:lin-bus-tree:0.1.0'
    compileOnly 'org.enginehub.lin-bus:lin-bus-common:0.1.0'

    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    testImplementation 'com.google.code.findbugs:jsr305:3.0.2'
}

shadowJar {
    archiveClassifier.set('')
    relocate 'net.objecthunter', 'io.github.mdsimmo.bomberman.lib.net.objecthunter'
    relocate 'kotlin', 'io.github.mdsimmo.bomberman.lib.kotlin'
    relocate 'org.jetbrains', 'io.github.mdsimmo.bomberman.lib.org.jetbrains'
    relocate 'org.intellij', 'io.github.mdsimmo.bomberman.lib.org.intellij'
}

tasks.build {
    dependsOn shadowJar
}

processResources {
    filesMatching('plugin.yml') {
        filter { line ->
            line.replace('${version}', version.toString())
        }
    }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_25)
    }
}

tasks.named('test') {
    enabled = false
}
